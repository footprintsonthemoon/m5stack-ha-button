# 1) Neues Script anlegen:
#    Einstellungen -> Automationen & Szenen -> Skripte -> "+ Skript hinzufügen"
#    -> oben rechts drei Punkte -> "In YAML bearbeiten" -> dies einfügen.

alias: Kameras aus
sequence:
  - action: switch.turn_off
    target:
      entity_id: switch.tapo_camera_plug  # Steckdose der Tapo-Kamera
  - action: switch.turn_off
    target:
      entity_id: switch.eufy_camera_1_enabled
  - action: switch.turn_off
    target:
      entity_id: switch.eufy_camera_2_enabled

---
# 2) Neue Automation anlegen, die per Webhook nur das obige Script auslöst:
#    Einstellungen -> Automationen & Szenen -> "+ Automation hinzufügen" ->
#    "Leere Automation erstellen" -> drei Punkte -> "In YAML bearbeiten".

alias: Kameras aus (Webhook)
trigger:
  - trigger: webhook
    webhook_id: your-webhook-id-3
    local_only: true
    allowed_methods:
      - POST
action:
  - action: script.turn_on
    target:
      entity_id: script.kamera_aus
  - action: persistent_notification.create
    data:
      title: "Kameras aus"
      message: "Kameras wurden ausgeschaltet."
mode: single
